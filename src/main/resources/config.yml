# AntiCheatPlugin 配置文件

# API 认证密钥（需与后端 application.yml 中的 api.key 一致）
api:
  key: anticheat-plugin-secret-api-key-change-in-production

# WebSocket 服务器配置
websocket:
  host: localhost
  port: 8080

# 调试模式（生产环境请设置为 false）
debug: false

# 后端不可用时的降级策略
# allow - 放行所有玩家（默认）
# deny - 拒绝所有玩家入服
# whitelist_only - 仅允许白名单玩家入服
fallback:
  strategy: allow

# 配置同步设置
sync:
  # 是否从服务器同步配置（开启后插件启动时和运行中都会从后端获取配置）
  enabled: true
  # 自动同步间隔（秒），0表示仅在启动时同步
  interval: 300

# 检测开关
detection:
  fly: true
  speed: true
  autoclick: true
  fly_permission: true
  aimbot: true
  killaura: true
  xray: true

# 检测阈值
thresholds:
  # 速度检测阈值 (m/s)
  max-walk-speed: 5.0
  max-sprint-speed: 7.0
  max-fly-speed: 12.0

  # 自动点击检测阈值 (次/秒)
  max-clicks-per-second: 15

  # 瞄准辅助检测阈值
  max-yaw-change: 160.0
  max-pitch-change: 90.0
  aim-violation-threshold: 3

  # 杀戮光环检测阈值
  killaura-targets: 3
  killaura-window: 1000

  # X-Ray透视检测阈值
  xray-rare-ore-ratio: 0.15
  xray-min-blocks: 50

  # 飞行检测阈值
  max-air-ticks: 10
  max-hover-count: 5

# 惩罚配置
punishment:
  cooldown: 3000
  warning-threshold: 1
  temp-ban-threshold: 2
  perm-ban-threshold: 3
  temp-ban-duration: 3600000

# 消息配置（支持颜色代码和变量替换）
# 可用变量: %cheatType%, %count%
messages:
  warning: "&c&l[AntiCheat] &e警告! &f检测到疑似 &c%cheatType% &f行为"
  warning-count: "&c&l[AntiCheat] &f这是第 &e%count% &f次警告"
  kick: "&c[AntiCheat] &f检测到多次作弊行为，你已被踢出服务器"

# 权限说明
# anticheat.bypass - 跳过所有检测
# anticheat.fly - 允许飞行
# anticheat.admin - 管理员权限
# anticheat.notify - 接收检测通知
# anticheat.report - 举报权限
