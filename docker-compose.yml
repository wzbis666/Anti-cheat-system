version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: anticheat-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-YOUR_DB_PASSWORD_HERE}
      MYSQL_DATABASE: anticheat
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anticheat-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/anticheat?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-YOUR_DB_PASSWORD_HERE}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-secret-at-least-32-chars}
      API_KEY: ${API_KEY:-change-me-to-a-random-api-key-at-least-32-chars}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      SERVER_PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: anticheat-frontend
    restart: unless-stopped
    ports:
      - "3030:80"
    depends_on:
      - backend

volumes:
  mysql_data:
